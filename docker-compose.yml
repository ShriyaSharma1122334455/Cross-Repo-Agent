services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]

  agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      STATE_BACKEND: dynamo
      DYNAMO_TABLE: blast-radius-actions
      DYNAMO_ENDPOINT_URL: http://dynamodb-local:8000
    depends_on:
      - dynamodb-local
    ports:
      - "8080:8080"
