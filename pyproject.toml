[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blast-radius-agent"
version = "0.1.0"
description = "Agent that determines which consumer repos actually break when a shared TS/JS library changes, and proposes fixes or escalations."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "strands-agents",
    "strands-agents-tools",
    "tree-sitter",
    "tree-sitter-typescript",
    "pygithub",
    "fastapi",
    "uvicorn",
    "httpx",
    "boto3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
